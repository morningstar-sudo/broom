# Build iPXE (snponly.efi = upstream at mgmt/ipxe/IPXE_COMMIT + mgmt/ipxe/patches) + a debug mgmt binary (iPXE + web UI +
# scripts embedded), run the unit tests, build the Windows stage bundle and the assets bundle (web UI, iPXE, scripts) with
# it, then the release binary (static musl) pinned to both and without the assets inside; keep binary + bundles +
# snponly.efi as artifacts. Every push to main also tags the commit with its push time (UTC, e.g. 2026-09-19T17-05-25Z) and
# publishes a release with those files.
name: build

# Docs, Markdown and screenshots only → no build, no release.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # tag + release on pushes to main
    env:
      # build.sh defaults to ~/broom-target; keep it inside the workspace so rust-cache can restore it.
      CARGO_TARGET_DIR: ${{ github.workspace }}/mgmt/target
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      # iPXE: gcc/make/perl + liblzma (util/zbin). mgmt: musl-gcc for the bundled SQLite C code.
      # Unit tests use mkfs.ext4 / sfdisk / tar (already on the runner); busybox-initramfs = the shell the Windows
      # stage really runs in (its applets win over PATH) → the stage tests run in it. qemu-utils: the VMDK/VHDX
      # tests check broom's own reader/writers against qemu-img (tests only, the server doesn't need it).
      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential perl liblzma-dev musl-tools busybox-initramfs qemu-utils

      # rustup reads mgmt/rust-toolchain.toml → latest stable + the musl target.
      - name: Rust toolchain
        working-directory: mgmt
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mgmt -> target

      # Release tag = the push time, ISO 8601 in UTC with "-" for ":" (git refuses ":" in a tag), e.g. 2026-09-19T17-05-25Z:
      # the same on a re-run of that push, so a re-run updates its release instead of making another. Manual runs / pull
      # requests (no release): the build time. The release title is the same.
      - name: Release tag
        id: tag
        env:
          PUSHED_AT: ${{ github.event.repository.pushed_at }}
        run: |
          t=$(date +%s)
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$PUSHED_AT" ]; then t=$PUSHED_AT; fi
          name=$(date -u -d "@$t" +%Y-%m-%dT%H-%M-%SZ)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "title=$name" >> "$GITHUB_OUTPUT"

      # --ipxe: always fetch + patch + build snponly.efi from source (it is not in git).
      # --dev: this binary only makes the bundles below → a debug build sharing cargo test's dependencies. The release
      # build (fat LTO, one codegen unit: one core for a minute) runs once, for the shipped binary.
      # `bash`, not ./build.sh: committed from Windows the script has no exec bit (mode 100644).
      - name: Build iPXE + bootrom-mgmt (debug) + unit tests
        run: bash build.sh --ipxe --dev

      # The Windows stage (kernel + initrd + shim) is built HERE, on Ubuntu's Canonical-signed generic kernel + its
      # Microsoft-signed shim: servers then install no packages for it and Secure Boot works whatever kernel they run.
      - name: Stage bundle
        id: stage
        run: |
          sudo apt-get install -y -qq linux-image-generic shim-signed initramfs-tools fdisk ntfs-3g dosfstools efibootmgr wget zstd mawk
          # No CPU microcode in the stage's initrd (~14 MB less to download on every boot): the stage lives a few
          # seconds, and microcode loaded there is gone at its reboot anyway — Windows loads its own.
          echo 'IUCODE_TOOL_INITRAMFS=no' | sudo tee /etc/default/intel-microcode >/dev/null
          echo 'AMD64UCODE_INITRAMFS=no' | sudo tee /etc/default/amd64-microcode >/dev/null
          kv=$(ls /lib/modules | grep -- '-generic$' | sort -V | tail -1)
          mkdir -p "$PWD/stage-out"
          sha=$(sudo mgmt/dist/bootrom-mgmt build-stage "$PWD/stage-out" --kernel "$kv" | tail -1)
          sudo chown -R "$(id -u):$(id -g)" stage-out
          echo "kernel $kv - broom-stage.tar.gz sha256 $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Web UI, iPXE, scripts → broom-assets.zip, packed by the binary that still embeds them (assets.rs keeps the list).
      - name: Assets bundle
        id: assets
        run: |
          sha=$(mgmt/dist/bootrom-mgmt pack-assets "$PWD/stage-out/broom-assets.zip" | tail -1)
          echo "broom-assets.zip sha256 $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The release binary, pinned to both bundles (mgmt/stage.pin + mgmt/assets.pin, embedded at build time) and
      # without the assets inside (build.sh sees the pin): it downloads them from this release — the assets on its
      # first start, the stage on the first Windows publish — and accepts nothing else.
      - name: Pin the bundles in the binary
        run: |
          url="https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.name }}"
          printf '%s\n%s\n' "${{ steps.stage.outputs.sha }}" "$url/broom-stage.tar.gz" >> mgmt/stage.pin
          printf '%s\n%s\n' "${{ steps.assets.outputs.sha }}" "$url/broom-assets.zip" >> mgmt/assets.pin
          cat mgmt/stage.pin mgmt/assets.pin
          bash build.sh --no-test

      - name: Checksums
        run: |
          cp stage-out/broom-stage.tar.gz stage-out/broom-assets.zip mgmt/dist/
          cd mgmt
          sha256sum dist/bootrom-mgmt ipxe/snponly.efi dist/broom-stage.tar.gz dist/broom-assets.zip | tee SHA256SUMS
          file dist/bootrom-mgmt

      - uses: actions/upload-artifact@v4
        with:
          name: bootrom-mgmt-${{ github.sha }}
          path: |
            mgmt/dist/bootrom-mgmt
            mgmt/ipxe/snponly.efi
            mgmt/dist/broom-stage.tar.gz
            mgmt/dist/broom-assets.zip
            mgmt/SHA256SUMS
          if-no-files-found: error

      # Pushes to main only (not pull requests). The action creates the tag on this commit; a tag made with
      # GITHUB_TOKEN does not start another workflow run.
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.title }}
          files: |
            mgmt/dist/bootrom-mgmt
            mgmt/ipxe/snponly.efi
            mgmt/dist/broom-stage.tar.gz
            mgmt/dist/broom-assets.zip
            mgmt/SHA256SUMS
          generate_release_notes: true
