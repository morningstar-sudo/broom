# Build iPXE (snponly.efi = upstream at mgmt/ipxe/IPXE_COMMIT + mgmt/ipxe/patches) + the mgmt binary (static musl, iPXE + web UI embedded),
# run the unit tests, keep both as artifacts. Every push to main also tags the commit
# v<Cargo.toml version>-<short sha> (e.g. v0.3.0-a1b2c3d) and publishes a release with the files.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # tag + release on pushes to main
    env:
      # build.sh defaults to ~/broom-target; keep it inside the workspace so rust-cache can restore it.
      CARGO_TARGET_DIR: ${{ github.workspace }}/mgmt/target
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      # iPXE: gcc/make/perl + liblzma (util/zbin). mgmt: musl-gcc for the bundled SQLite C code.
      # Unit tests use mkfs.ext4 / sfdisk / tar (already on the runner); busybox-initramfs = the shell the Windows
      # stage really runs in (its applets win over PATH) → the stage tests run in it. qemu-utils: the VMDK/VHDX
      # tests check broom's own reader/writers against qemu-img (tests only, the server doesn't need it).
      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential perl liblzma-dev musl-tools busybox-initramfs qemu-utils

      # rustup reads mgmt/rust-toolchain.toml → latest stable + the musl target.
      - name: Rust toolchain
        working-directory: mgmt
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mgmt -> target

      # Release tag for this commit: v<Cargo.toml version>-<short sha>.
      - name: Release tag
        id: tag
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' mgmt/Cargo.toml | head -1)
          echo "name=v$v-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # --ipxe: always fetch + patch + build snponly.efi from source (it is not in git).
      # `bash`, not ./build.sh: committed from Windows the script has no exec bit (mode 100644).
      - name: Build iPXE + bootrom-mgmt + unit tests
        run: bash build.sh --ipxe

      # The Windows stage (kernel + initrd + shim) is built HERE, on Ubuntu's Canonical-signed generic kernel + its
      # Microsoft-signed shim: servers then install no packages for it and Secure Boot works whatever kernel they run.
      - name: Stage bundle
        id: stage
        run: |
          sudo apt-get install -y -qq linux-image-generic shim-signed initramfs-tools fdisk ntfs-3g dosfstools efibootmgr wget zstd mawk
          kv=$(ls /lib/modules | grep -- '-generic$' | sort -V | tail -1)
          mkdir -p "$PWD/stage-out"
          sha=$(sudo mgmt/dist/bootrom-mgmt build-stage "$PWD/stage-out" --kernel "$kv" | tail -1)
          sudo chown -R "$(id -u):$(id -g)" stage-out
          echo "kernel $kv - broom-stage.tar.gz sha256 $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The same binary again, now pinned to that bundle (mgmt/stage.pin, embedded at build time): it downloads it
      # from this release on the first Windows publish and accepts nothing else.
      - name: Pin the stage bundle in the binary
        run: |
          printf '%s\n%s\n' "${{ steps.stage.outputs.sha }}" \
            "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.name }}/broom-stage.tar.gz" \
            >> mgmt/stage.pin
          cat mgmt/stage.pin
          bash build.sh --no-test

      - name: Checksums
        run: |
          cp stage-out/broom-stage.tar.gz mgmt/dist/
          cd mgmt
          sha256sum dist/bootrom-mgmt ipxe/snponly.efi dist/broom-stage.tar.gz | tee SHA256SUMS
          file dist/bootrom-mgmt

      - uses: actions/upload-artifact@v4
        with:
          name: bootrom-mgmt-${{ github.sha }}
          path: |
            mgmt/dist/bootrom-mgmt
            mgmt/ipxe/snponly.efi
            mgmt/dist/broom-stage.tar.gz
            mgmt/SHA256SUMS
          if-no-files-found: error

      # Pushes to main only (not pull requests). The action creates the tag on this commit; a tag made with
      # GITHUB_TOKEN does not start another workflow run.
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.name }}
          files: |
            mgmt/dist/bootrom-mgmt
            mgmt/ipxe/snponly.efi
            mgmt/dist/broom-stage.tar.gz
            mgmt/SHA256SUMS
          generate_release_notes: true
