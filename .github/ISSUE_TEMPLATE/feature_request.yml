name: Feature request
description: Something Broom should do, or do differently
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the situation first — the room, the machines, what goes wrong today. The simplest fix is easier to
        find from the problem than from a ready-made solution. Vietnamese or English is fine.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
      placeholder: "We have 40 machines and 3 groups; every time we update a game we have to…"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you imagine it working (web page, client behaviour…).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today / alternatives
      description: Workarounds you use, other tools you've seen do this.
  - type: input
    id: scale
    attributes:
      label: Your setup
      placeholder: "e.g. 40 Windows machines, 2 images, Ubuntu 24.04 server"
