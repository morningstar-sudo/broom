[package]
name = "bootrom-mgmt"
version = "0.0.0"
edition = "2024"
description = "Diskless boot server: DHCP, TFTP, iPXE, iSCSI and a web admin in one binary"

[[bin]]
name = "bootrom-mgmt"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }   # ws: Remote page (vnc.rs)
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }   # SQLite driver (db/sqlite.rs)
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
futures-util = "0.3.34"   # SSE stream
socket2 = { version = "0.6.5", features = ["all"] }   # DHCP/TFTP sockets (bind to interface, broadcast)
libc = "0.2.189"   # fallocate punch-hole, geteuid
sha2 = "0.11.0"   # golden sha256 (replaces sha256sum)
hmac = "0.13"   # HMAC-SHA256: the Remote agent handshake (agentauth.rs; .NET HMACSHA256) and the sign-in (pwproof.rs)
blake3 = "1.8.7"   # session MACs (auth.rs), agent keys (agentauth.rs), stable disk GUIDs (disk.rs)
tracing = "0.1.44"   # logging (events → stdout, warnings/errors → stderr)
tracing-subscriber = "0.3.23"   # log output (RUST_LOG=level)
ext4-view = "1.0.0"   # read ext4 inside Linux goldens (replaces libguestfs)
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }   # golden .zip upload (replaces unzip)
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }   # gzip for initrd cpio + tar.gz (archive.rs)
crc32fast = "1.5.2"   # GPT checksums (disk.rs)
ureq = "3"   # HTTPS download of the Windows stage bundle (rustls + built-in CA roots, static-friendly)
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }   # password verifiers of the sign-in handshake (pwproof.rs)
# Read the Windows golden's NTFS in process (ntfsread.rs; no loop + ntfs3 on the server). Pinned to upstream master:
# the 0.4.0 release pulls binrw 0.11, which a future Rust rejects; master replaced it with zerocopy. Back to a
# crates.io version once one after 0.4.0 is out.
ntfs = { git = "https://github.com/ColinFinck/ntfs", rev = "47ae0168f6c607208b27c61ed89b4ffac9a3c99a" }
zstd = "0.14.0"   # RAM cache mode of Linux goldens: 16 KB blocks compressed in the iSCSI daemon (iscsid/ramimg.rs)
parking_lot = "0.12.5"   # Mutex without poisoning: a panicking handler must not take every later request down with it
mimalloc = "0.1.52"   # global allocator: musl's malloc serializes threads (iSCSI daemon QD32 reads: 2× slower with it)

[features]
# Release build (CI): web UI / iPXE / scripts not embedded — loaded from the release's broom-assets.zip (assets.rs).
# build.sh turns it on by itself when assets.pin holds a pin.
external-assets = []

# Debug builds (tests; CI's bundle steps run a debug binary, build.sh --dev) with optimized dependencies: gzip, sha256,
# zstd at release speed, only this crate stays quick to compile.
[profile.dev.package."*"]
opt-level = 3

# Fat LTO (whole-program, across every crate); 16 codegen units after it so the code generation uses every core:
# measured on 4 cores, 80 s instead of 112 s for a 3% larger binary.
[profile.release]
strip = true
lto = true
codegen-units = 16
