<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broom Console — Sign in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%230b0f17'/%3E%3Cg transform='translate(250 246) rotate(35) scale(0.8) translate(-256 -256)'%3E%3Crect x='240' y='20' width='32' height='270' rx='16' fill='%23e6edf6'/%3E%3Crect x='186' y='276' width='140' height='44' rx='14' fill='%2335c1f0'/%3E%3Cpath d='M194 330 H318 L366 488 Q256 512 146 488 Z' fill='%2335c1f0'/%3E%3Cg stroke='%230b0f17' stroke-width='10' stroke-linecap='round'%3E%3Cpath d='M222 346 L206 484'/%3E%3Cpath d='M256 346 V490'/%3E%3Cpath d='M290 346 L306 484'/%3E%3C/g%3E%3C/g%3E%3Cg fill='%23e6edf6'%3E%3Cpath d='M384 330 Q390 366 426 372 Q390 378 384 414 Q378 378 342 372 Q378 366 384 330 Z'/%3E%3Cpath d='M326 410 Q329 428 347 431 Q329 434 326 452 Q323 434 305 431 Q323 428 326 410 Z'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{--bg:#0b0f17;--panel:#121a26;--line:#1f2b3a;--ink:#e6edf6;--muted:#7c8ba3;
    --accent:#35c1f0;--accent-ink:#04121b;--off:#ff6b6b;
    --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;}
  @media (prefers-color-scheme:light){:root{--bg:#eef1f5;--panel:#fff;--line:#dde3ec;
    --ink:#16202e;--muted:#64748b;--accent:#0ea5e9;--accent-ink:#fff;--off:#dc2626;}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);display:flex;
    align-items:center;justify-content:center;
    font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px 30px;
    display:flex;flex-direction:column;gap:12px;width:min(360px,92vw)}
  .brand{display:flex;align-items:center;gap:8px;font-size:1.15rem;letter-spacing:.06em;font-weight:700}
  .brand::before{content:"";width:11px;height:11px;border-radius:3px;background:var(--accent);
    box-shadow:0 0 12px var(--accent)}
  h2{margin:.2rem 0 0;font-size:1.1rem}
  .hint{color:var(--muted);font-size:.82rem;margin:0}
  input{padding:9px 11px;background:var(--bg);border:1px solid var(--line);border-radius:8px;
    color:var(--ink);font:inherit}
  input:focus{outline:none;border-color:var(--accent)}
  button{padding:10px 12px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;
    font:600 .92rem inherit;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .msg{font:600 .82rem/1.4 var(--mono);color:var(--off);min-height:1.1rem;overflow-wrap:anywhere}
</style>
<form id="f" autocomplete="on">
  <div class="brand">Broom Console</div>
  <h2 id="title">Sign in</h2>
  <p class="hint" id="hint">Enter the admin password.</p>
  <input id="tok" placeholder="Setup token (from the server log)" autocomplete="off" spellcheck="false" hidden>
  <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password" required>
  <input id="pw2" type="password" placeholder="Confirm password" autocomplete="new-password" hidden>
  <button id="go" type="submit">Continue</button>
  <span class="msg" id="msg"></span>
</form>
<script src="/login.js"></script>
