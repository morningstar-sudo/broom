<section id="page-benchmark">
  <div class="d-flex flex-wrap align-items-baseline gap-3 mb-4"><h1 class="h4 mb-0">Benchmark</h1>
    <span class="flex-grow-1"></span><button class="btn btn-sm btn-outline-secondary" data-click="loadBench" title="Refresh" aria-label="Refresh"><svg class="ic" aria-hidden="true"><use href="/icons.svg#refresh"/></svg></button></div>
  <div class="card card-body mb-3">
    <h2 class="h6 text-uppercase text-body-secondary mb-3">Server now</h2>
    <div id="b_res" class="msg">—</div>
  </div>
  <div class="card card-body mb-3">
    <h2 class="h6 text-uppercase text-body-secondary mb-3">Server disk</h2>
    <div class="d-flex flex-wrap gap-2 align-items-center">
      <span class="mono">sequential</span><b id="b_seq">—</b>
      <span class="mono ms-3">random 4K</span><b id="b_rand">—</b>
      <span class="flex-grow-1"></span>
      <button class="btn btn-sm btn-primary" data-click="benchServer">Run</button>
    </div>
    <div id="bench_msg" class="msg mt-2"></div>
  </div>
  <div class="card card-body mb-3">
    <h2 class="h6 text-uppercase text-body-secondary mb-3">iSCSI now</h2>
    <div id="b_iscsi" class="msg">—</div>
  </div>
  <div class="card card-body mb-3">
    <h2 class="h6 text-uppercase text-body-secondary mb-3">Clients</h2>
    <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
      <button class="btn btn-sm btn-primary" data-click="benchRequest">Measure at next boot</button>
      <button class="btn btn-sm btn-outline-secondary" data-click="benchCancel">Cancel</button>
      <span id="bq_msg" class="msg"></span>
    </div>
    <div class="table-responsive"><table class="table table-sm table-hover align-middle" id="b_clients">
      <thead><tr><th><input class="form-check-input" type="checkbox" data-change="bSelAll" title="all"></th><th>Machine</th><th>Boot</th><th>Disk read</th><th>Network</th><th>Measured</th></tr></thead>
      <tbody></tbody></table></div>
  </div>
  <div class="card card-body mb-3">
    <h2 class="h6 text-uppercase text-body-secondary mb-3">History</h2>
    <div class="mb-2"><select class="form-select form-select-sm w-auto" id="b_hmac" data-change="loadBenchHist"></select></div>
    <div class="table-responsive"><table class="table table-sm table-hover align-middle" id="b_hist">
      <thead><tr><th>Time</th><th>Machine</th><th>Test</th><th>Result</th><th>Detail</th></tr></thead>
      <tbody></tbody></table></div>
  </div>
</section>
