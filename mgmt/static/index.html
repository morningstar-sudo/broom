<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broom Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%230b0f17'/%3E%3Cg transform='translate(250 246) rotate(35) scale(0.8) translate(-256 -256)'%3E%3Crect x='240' y='20' width='32' height='270' rx='16' fill='%23e6edf6'/%3E%3Crect x='186' y='276' width='140' height='44' rx='14' fill='%2335c1f0'/%3E%3Cpath d='M194 330 H318 L366 488 Q256 512 146 488 Z' fill='%2335c1f0'/%3E%3Cg stroke='%230b0f17' stroke-width='10' stroke-linecap='round'%3E%3Cpath d='M222 346 L206 484'/%3E%3Cpath d='M256 346 V490'/%3E%3Cpath d='M290 346 L306 484'/%3E%3C/g%3E%3C/g%3E%3Cg fill='%23e6edf6'%3E%3Cpath d='M384 330 Q390 366 426 372 Q390 378 384 414 Q378 378 342 372 Q378 366 384 330 Z'/%3E%3Cpath d='M326 410 Q329 428 347 431 Q329 434 326 452 Q323 434 305 431 Q323 428 326 410 Z'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/bootstrap.min.css?v=__VERSION__">
<link rel="stylesheet" href="/app.css?v=__VERSION__">

<!-- Small screens: a top bar with the menu button; the sidebar slides in (offcanvas). -->
<header class="navbar bg-body-tertiary border-bottom d-lg-none px-3">
  <span class="navbar-brand fw-bold">Broom</span>
  <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar" aria-label="Menu"><span class="navbar-toggler-icon"></span></button>
</header>

<div class="d-lg-flex">
  <aside class="offcanvas-lg offcanvas-start bg-body-tertiary border-end" id="sidebar" tabindex="-1" aria-label="Menu">
    <div class="offcanvas-header border-bottom">
      <span class="fw-bold">Menu</span>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column p-3 h-100">
      <div class="mb-3 px-2"><div class="fs-5 fw-bold">Broom</div><div class="small text-body-secondary">bootrom console · v__VERSION__</div></div>
      <nav class="nav nav-pills flex-column gap-2 flex-grow-1">
        <details class="nav-group" data-group="monitor"><summary class="small text-uppercase text-body-secondary px-2 py-1">Monitor</summary>
          <div class="d-flex flex-column gap-1 mt-1">
            <a class="nav-link" href="/machines" data-page="machines">Machines</a>
            <a class="nav-link" href="/remote" data-page="remote">Remote</a>
            <a class="nav-link" href="/server" data-page="server">Server</a>
          </div></details>
        <details class="nav-group" data-group="manage" data-owner><summary class="small text-uppercase text-body-secondary px-2 py-1">Manage</summary>
          <div class="d-flex flex-column gap-1 mt-1">
            <a class="nav-link" href="/devices" data-page="devices">Devices</a>
            <a class="nav-link" href="/groups" data-page="groups">Groups</a>
          </div></details>
        <details class="nav-group" data-group="content"><summary class="small text-uppercase text-body-secondary px-2 py-1">Content</summary>
          <div class="d-flex flex-column gap-1 mt-1">
            <a class="nav-link" href="/images" data-page="images" data-owner>Images</a>
            <a class="nav-link" href="/games" data-page="games">Games</a>
            <a class="nav-link" href="/drivers" data-page="drivers" data-owner>Drivers</a>
          </div></details>
        <details class="nav-group" data-group="config"><summary class="small text-uppercase text-body-secondary px-2 py-1">Config</summary>
          <div class="d-flex flex-column gap-1 mt-1">
            <a class="nav-link" href="/network" data-page="network" data-owner>Network</a>
            <a class="nav-link" href="/windows" data-page="windows" data-owner>Windows</a>
            <a class="nav-link" href="/system" data-page="system">Settings</a>
          </div></details>
        <details class="nav-group" data-group="tools"><summary class="small text-uppercase text-body-secondary px-2 py-1">Tools</summary>
          <div class="d-flex flex-column gap-1 mt-1">
            <a class="nav-link" href="/benchmark" data-page="benchmark" data-owner>Benchmark</a>
            <a class="nav-link" href="/logs" data-page="logs">Logs</a>
          </div></details>
      </nav>
      <div class="border-top pt-3 px-2 mono"><span class="dot" id="srvdot" title="connecting..."></span>server · <span id="onlinecount">—</span></div>
      <div class="small text-body-secondary px-2 mt-2" id="whoami"></div>
      <button class="btn btn-sm btn-outline-secondary mt-2" data-click="logout">Log out</button>
    </div>
  </aside>

  <div class="flex-grow-1" style="min-width:0">
    <!-- Server resources over the alert threshold (sysmon.rs, "res" SSE events): shown on every page. -->
    <div id="alertbar" class="alert alert-danger mx-3 mx-lg-4 mt-3 mb-0" role="alert" hidden></div>
    <main id="main" class="p-3 p-lg-4"><!-- tab fragment loaded on demand from /ui/<page> --></main>
  </div>
</div>

<!-- The one dialog of the app (app.js dialog()): ask() with a text box / textarea, sure() with OK / Cancel only. -->
<div class="modal fade" id="dlg" tabindex="-1" aria-labelledby="dlg_title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content" id="dlg_form">
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="dlg_title"></h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p id="dlg_text" class="mb-2" style="white-space:pre-wrap"></p>
        <input id="dlg_input" class="form-control" autocomplete="off" spellcheck="false">
        <textarea id="dlg_area" class="form-control font-monospace" rows="10" spellcheck="false"></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary" id="dlg_ok">OK</button>
      </div>
    </form>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body" id="toast_text" style="white-space:pre-wrap"></div>
      <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>

<script src="/bootstrap.bundle.min.js?v=__VERSION__"></script>
<script src="/chart.umd.min.js?v=__VERSION__"></script>
<script src="/app.js?v=__VERSION__"></script>
