<section id="page-groups">
  <div class="d-flex flex-wrap align-items-baseline gap-3 mb-4"><h1 class="h4 mb-0">Groups</h1>
    <span class="flex-grow-1"></span><button class="btn btn-sm btn-outline-secondary" data-click="loadGroups" title="Refresh" aria-label="Refresh"><svg class="ic" aria-hidden="true"><use href="/icons.svg#refresh"/></svg></button></div>
  <div class="card card-body mb-3">
    <h2 class="h6 text-uppercase text-body-secondary mb-3">Groups</h2>
    <div class="table-responsive"><table class="table table-sm table-hover align-middle" id="groups">
      <thead><tr><th>Group</th><th>Machines</th><th>Images (boot menu)</th><th>Games disks</th><th>Drivers</th><th></th></tr></thead>
      <tbody></tbody></table></div>
    <div class="d-flex flex-wrap gap-2 align-items-end mt-2">
      <div><label class="form-label small mb-1" for="gr_new">New group</label><input class="form-control form-control-sm" id="gr_new" size="14" placeholder="VIP"></div>
      <button class="btn btn-sm btn-primary" data-click="createGroup">Create</button>
      <span id="gr_msg" class="msg align-self-center"></span>
    </div>
  </div>
  <div class="card card-body mb-3" id="gr_edit" style="display:none">
    <h2 class="h6 text-uppercase text-body-secondary mb-3" id="gr_title"></h2>
    <div class="d-flex flex-wrap align-items-start gap-4">
      <div><b>Machines</b><div id="gr_machines" class="mt-1" style="max-height:340px;overflow:auto"></div></div>
      <div><b>Images</b><div id="gr_images" class="mt-1"></div></div>
      <div><b>Games disks</b><div id="gr_disks" class="mt-1"></div></div>
      <div><b>Drivers</b><div id="gr_drivers" class="mt-1"></div></div>
      <div><b>Local disks</b><div class="mt-1"><label class="form-check text-nowrap" title="Every disk of the machine but its Broom disk: offline in Windows, gone on a Linux image. A machine can override it (Devices → its Disks)."><input class="form-check-input" type="checkbox" id="gr_hide"> Hide the other disks from the guest</label></div></div>
    </div>
    <div class="d-flex flex-wrap gap-2 align-items-center mt-3">
      <button class="btn btn-sm btn-primary" data-click="saveGroup">Save</button>
      <button class="btn btn-sm btn-outline-secondary" data-click="closeGroup">Close</button>
      <span id="gr_emsg" class="msg"></span>
    </div>
    <p class="form-text">A machine shown with another group in brackets moves to this one when ticked.</p>
  </div>
</section>
