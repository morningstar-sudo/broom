<section id="page-network">
  <div class="d-flex flex-wrap align-items-baseline gap-3 mb-4"><h1 class="h4 mb-0">Network</h1></div>
  <div class="card card-body mb-3">
    <h2 class="h6 text-uppercase text-body-secondary mb-3">DHCP settings</h2>
    <div class="d-flex flex-wrap gap-3 align-items-end">
      <div><label class="form-label small mb-1" for="dhcp_mode">DHCP server</label><select class="form-select form-select-sm" id="dhcp_mode"><option value="off">off</option><option value="full">on</option></select></div>
      <div><label class="form-label small mb-1" for="dhcp_iface">IFACE</label><input class="form-control form-control-sm" id="dhcp_iface" size="8"></div>
      <div><label class="form-label small mb-1" for="dhcp_server_ip">Server IP</label><input class="form-control form-control-sm" id="dhcp_server_ip" size="12"></div>
      <div><label class="form-label small mb-1" for="dhcp_subnet">Subnet</label><input class="form-control form-control-sm" id="dhcp_subnet" size="12"></div>
      <div><label class="form-label small mb-1" title="Clients get the official, signed iPXE (works with Secure Boot on). Menu footer shows as lines under the images.">Secure Boot clients</label>
        <div class="form-check"><input class="form-check-input" id="dhcp_ipxe_signed" type="checkbox"><label class="form-check-label" for="dhcp_ipxe_signed">Official signed iPXE</label></div></div>
    </div>
    <div class="mt-3" id="full_only"><div class="d-flex flex-wrap gap-3 align-items-end">
      <div><label class="form-label small mb-1" for="dhcp_netmask" title="Subnet mask the clients get (option 1); detected from the server's own network at setup">Netmask</label><input class="form-control form-control-sm" id="dhcp_netmask" size="12" placeholder="255.255.255.0"></div>
      <div><label class="form-label small mb-1" for="dhcp_range_start">Range start</label><input class="form-control form-control-sm" id="dhcp_range_start" size="12" placeholder="auto .100"></div>
      <div><label class="form-label small mb-1" for="dhcp_range_end">Range end</label><input class="form-control form-control-sm" id="dhcp_range_end" size="12" placeholder=".200"></div>
      <div><label class="form-label small mb-1" for="dhcp_gateway">Gateway</label><input class="form-control form-control-sm" id="dhcp_gateway" size="12"></div>
      <div id="dhcp_dns_field"><label class="form-label small mb-1" title="One server per box, in order of preference (clients try the first one first), at most 8">DNS servers</label>
        <div id="dns_list" class="d-flex flex-wrap gap-2 align-items-center"></div></div>
      <div id="dhcp_dns_self" hidden><label class="form-label small mb-1">DNS servers</label><div class="small text-body-secondary pt-1">this server (DNS card below)</div></div>
    </div>
    <div id="dhcp_pool" class="small mt-2"></div>
    </div>
    <div class="mt-3" id="full_only_opts">
      <label class="form-label small mb-1">DHCP options</label>
      <div class="d-flex flex-wrap column-gap-4">
        <div class="form-check" title="iPXE takes this server's answer at once instead of waiting 2 s for ProxyDHCP offers (option 175). Untick only if another ProxyDHCP server on the LAN must answer iPXE."><input class="form-check-input" id="dhcp_ipxe_fast" type="checkbox"><label class="form-check-label" for="dhcp_ipxe_fast">iPXE: don't wait for ProxyDHCP</label></div>
        <div class="form-check" title="Machines that have a lease/static IP here but ask for another IP get a NAK and take a new one at once. Untick: stay silent (the client retries until its old lease runs out)."><input class="form-check-input" id="dhcp_authoritative" type="checkbox"><label class="form-check-label" for="dhcp_authoritative">Authoritative (NAK wrong IPs)</label></div>
        <div class="form-check" title="Send the hostname from the Machines table to the client (option 12)."><input class="form-check-input" id="dhcp_send_hostname" type="checkbox"><label class="form-check-label" for="dhcp_send_hostname">Send hostname</label></div>
        <div class="form-check" title="RFC 4039: a client that asks for it gets its IP in one round trip (ACK right after DISCOVER). iPXE / UEFI PXE never ask; some Linux clients (systemd-networkd) do. Only with broom as the LAN's only DHCP server."><input class="form-check-input" id="dhcp_rapid_commit" type="checkbox"><label class="form-check-label" for="dhcp_rapid_commit">Rapid Commit</label></div>
      </div>
    </div>
    <div class="mt-3">
      <label class="form-label small mb-1" title="Windows images: the machine can only start Windows through the network stage.">Strict reset (Windows)</label>
      <div class="form-check"><input class="form-check-input" id="dhcp_strict_reset" type="checkbox"><label class="form-check-label" for="dhcp_strict_reset">Windows starts only via PXE</label></div>
    </div>
    <div class="d-flex flex-wrap gap-2 align-items-center mt-3"><button class="btn btn-sm btn-primary" data-click="applyDhcp">Apply (restart DHCP/TFTP)</button> <span id="dhcp_msg" class="msg"></span></div>
  </div>
  <div class="card card-body mb-3" data-owner>
    <h2 class="h6 text-uppercase text-body-secondary mb-3">DNS — only for healthy machines</h2>
    <div class="d-flex flex-wrap gap-3 align-items-start">
      <div><label class="form-label small mb-1" for="dns_mode">DNS server</label><select class="form-select form-select-sm" id="dns_mode"><option value="off">off</option><option value="on">on</option></select></div>
      <div><label class="form-label small mb-1" for="dns_resolve" title="Passthrough: every query goes as it is to the DNS servers listed here; nothing is kept. Recursive: answered from this server's cache when it has the name (kept for its TTL), else asked of those DNS servers and cached — with none listed, resolved here from the root servers.">Resolve</label><select class="form-select form-select-sm" id="dns_resolve" data-change="dnsResolveShow"><option value="passthrough">passthrough (no cache)</option><option value="recursive">recursive (cache first)</option></select></div>
      <div><label class="form-label small mb-1" for="dns_up" id="dns_up_label">DNS servers</label><input class="form-control form-control-sm mono" id="dns_up" size="22" placeholder="8.8.8.8, 1.1.1.1"></div>
      <div><label class="form-label small mb-1" for="dns_grace">After a PXE boot</label><div class="input-group input-group-sm"><input class="form-control" id="dns_grace" type="number" min="0" max="120" style="width:70px"><span class="input-group-text">min</span></div></div>
      <div><label class="form-label small mb-1">Exempt groups</label><div id="dns_groups" class="small"></div></div>
      <div><label class="form-label small mb-1" for="dns_ips">Exempt IPs / ranges</label><textarea class="form-control form-control-sm mono" id="dns_ips" rows="3" cols="22" placeholder="10.0.0.5&#10;10.0.0.240/28"></textarea></div>
    </div>
    <div class="d-flex flex-wrap gap-2 align-items-center mt-3"><button class="btn btn-sm btn-primary" data-click="saveDnsGate">Save (restarts DHCP / DNS)</button> <span id="dnsg_msg" class="msg"></span></div>
    <div id="dnsg_state" class="small text-body-secondary mt-2"></div>
  </div>
</section>
