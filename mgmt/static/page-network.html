<section class="page active" id="page-network">
  <div class="head"><h1>Mạng</h1><p>DHCP + PXE</p></div>
  <div class="card">
    <h2>Cấu hình DHCP</h2>
    <div class="row">
      <div class="field"><label>Mode</label><select id="dhcp_mode"><option value="proxy">proxyDHCP</option><option value="full">full DHCP</option></select></div>
      <div class="field"><label>IFACE</label><input id="dhcp_iface" size="8"></div>
      <div class="field"><label>Server IP</label><input id="dhcp_server_ip" size="12"></div>
      <div class="field"><label>Subnet</label><input id="dhcp_subnet" size="12"></div>
    </div>
    <div class="row" id="full_only" style="margin-top:12px">
      <div class="field"><label>Range đầu</label><input id="dhcp_range_start" size="12" placeholder="tự .100"></div>
      <div class="field"><label>Range cuối</label><input id="dhcp_range_end" size="12" placeholder=".200"></div>
      <div class="field"><label>Gateway</label><input id="dhcp_gateway" size="12"></div>
      <div class="field"><label>DNS</label><input id="dhcp_dns" size="12"></div>
    </div>
    <div class="row" style="margin-top:14px"><button class="primary" onclick="applyDhcp()">Áp dụng + reload dnsmasq</button> <span id="dhcp_msg" class="msg"></span></div>
    <p class="hint">proxyDHCP: router cấp IP. full DHCP: dnsmasq cấp IP + boot (cần để hiện máy trong danh sách).</p>
  </div>
</section>
