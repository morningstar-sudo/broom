<section class="page active" id="page-machines">
  <div class="head"><h1>Machines</h1><p>registered machines + discovered via DHCP leases</p>
    <span class="sp"></span><button onclick="loadStatus()">↻ Refresh</button></div>
  <div class="card">
    <h2>Add machine</h2>
    <div class="row">
      <div class="field"><label>MAC</label><input id="m_mac" size="17" placeholder="aa:bb:cc:dd:ee:01"></div>
      <div class="field"><label>IP</label><input id="m_ip" size="12" placeholder="10.0.0.11"></div>
      <div class="field"><label>Hostname</label><input id="m_host" size="10" maxlength="15" pattern="[A-Za-z0-9-]{1,15}" title="Letters/digits/-, max 15 characters (Windows computer name)" placeholder="PC01"></div>
      <button class="primary" style="align-self:flex-end" onclick="addMachine()">Add</button>
      <span id="m_msg" class="msg"></span>
    </div>
  </div>
  <div class="card">
    <h2>Machine list</h2>
    <div class="row" style="margin-bottom:12px">
      <input id="m_filter" placeholder="Filter hostname / IP / MAC" oninput="mPage=1;renderMachines()" style="min-width:220px">
      <select id="m_status" onchange="mPage=1;renderMachines()">
        <option value="">All states</option>
        <option value="online">Online</option>
        <option value="offline">Offline</option>
        <option value="registered">Registered</option>
        <option value="new">New (not registered)</option>
      </select>
      <span style="flex:1"></span>
      <span id="m_count" class="msg"></span>
    </div>
    <div class="scroll"><table id="machines">
      <thead><tr><th>Hostname</th><th>IP</th><th>MAC</th><th>Status</th><th></th></tr></thead>
      <tbody></tbody></table></div>
    <div class="row" style="margin-top:12px;justify-content:flex-end;align-items:center">
      <button class="ghost" onclick="mPrev()">‹ Prev</button>
      <span id="m_page" class="msg"></span>
      <button class="ghost" onclick="mNext()">Next ›</button>
    </div>
    <p class="hint">A <span class="pill new">new</span> machine = has a DHCP lease but is not registered. Set a hostname → <b>Network → Apply</b> (regenerates DHCP) → reboot to get the IP/name.</p>
  </div>
</section>
